<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Synchronized Editor</title>
  <style>
    .editor-container {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
    }
    .editor-box {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 80px;
      margin-bottom: 10px;
      border-radius: 4px;
      outline: none;
    }
    .editor-box[contenteditable="true"] {
      border-color: #007bff;
      box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }
    .control-bar {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .last-updated {
      font-size: 14px;
      color: #555;
    }
    button {
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #f8f9fa;
    }
    button:hover {
      background-color: #e2e6ea;
    }
  </style>
</head>
<body>

<div class="editor-container">
  <!-- Editor Field -->
  <div id="editor" contenteditable="true" class="editor-box">
    Click here to edit content...
  </div>

  <!-- Controls & Timestamp -->
  <div class="control-bar">
    <button id="editBtn">Finish Editing</button>
    <span class="last-updated">
      Last updated: <span id="timestamp">--/--/---- --:--</span>
    </span>
  </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

  // 1. Replace with your actual Firebase Project Configuration:
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // 2. Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const editorRef = ref(db, 'shared_editor');

  let isEditing = true;

  const editor = document.getElementById('editor');
  const btn = document.getElementById('editBtn');
  const timestampSpan = document.getElementById('timestamp');

  // Helper function to format timestamp
  function formatDateTime(date) {
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();

    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');

    return `${day}/${month}/${year} ${hours}:${minutes}`;
  }

  // Save changes instantly to Firebase Cloud
  function saveToCloud() {
    const content = editor.innerText;
    const now = formatDateTime(new Date());

    set(editorRef, {
      content: content,
      timestamp: now
    }).catch(error => {
      console.error("Sync error:", error);
    });
  }

  // Toggle Edit/Finish Editing state
  function toggleEdit() {
    if (isEditing) {
      // Finish Editing action
      editor.contentEditable = "false";
      btn.innerText = "Edit";
      isEditing = false;
    } else {
      // Start Editing action
      editor.contentEditable = "true";
      editor.focus();
      btn.innerText = "Finish Editing";
      isEditing = true;
    }
  }

  btn.addEventListener('click', toggleEdit);

  // Trigger instant save & sync whenever any text changes inside the editor
  editor.addEventListener('input', () => {
    if (isEditing) {
      saveToCloud();
    }
  });

  // Real-time synchronization listener across all connected devices
  onValue(editorRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // Avoid overwriting local cursor position if the user is currently typing in this browser tab
      if (document.activeElement !== editor) {
        editor.innerText = data.content || "";
      }
      if (data.timestamp) {
        timestampSpan.innerText = data.timestamp;
      }
    }
  });
</script>

</body>
</html>
